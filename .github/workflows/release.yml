name: Release & Build

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install & Build
        run: |
          npm ci
          npm run build
        env:
          VITE_API_URL: ${{ secrets.PRODUCTION_API_URL || 'https://localhost:7065' }}

      - name: Upload Production Artifact
        uses: actions/upload-artifact@v4
        with:
          name: arclight-frontend-production
          path: dist/
          retention-days: 7
